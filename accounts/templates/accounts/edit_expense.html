<!DOCTYPE html>
<html>
<head>
    <title>Edit Expense - ExpenseTrack</title>
</head>
<body>

    <h1>ExpenseTrack</h1>
    <h2>Edit Expense</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Expense Name:</label>
        <input type="text" name="name" value="{{ expense.name }}" required>

        <br><br>

        <label>Amount:</label>
        <input type="number" name="amount" step="0.01" value="{{ expense.amount }}" required>

        <br><br>

        <label>Category:</label>
        <select name="category" required>
            <option value="">-- Select a category --</option>
            <option value="Food" {% if expense.category == "Food" %}selected{% endif %}>Food & Groceries</option>
            <option value="Transportation" {% if expense.category == "Transportation" %}selected{% endif %}>Transportation</option>
            <option value="Utilities" {% if expense.category == "Utilities" %}selected{% endif %}>Electricity, Water & Internet</option>
            <option value="Rent" {% if expense.category == "Rent" %}selected{% endif %}>Rent</option>
            <option value="Salary" {% if expense.category == "Salary" %}selected{% endif %}>Salaries & Wages</option>
            <option value="Supplies" {% if expense.category == "Supplies" %}selected{% endif %}>Business Supplies</option>
            <option value="Marketing" {% if expense.category == "Marketing" %}selected{% endif %}>Marketing & Advertising</option>
            <option value="Maintenance" {% if expense.category == "Maintenance" %}selected{% endif %}>Repairs & Maintenance</option>
            <option value="Taxes" {% if expense.category == "Taxes" %}selected{% endif %}>Taxes & Government Fees</option>
            <option value="Other" {% if expense.category == "Other" %}selected{% endif %}>Other</option>
        </select>

        <br><br>

        <label>Date:</label>
        <input type="date" name="date" value="{{ expense.date|date:'Y-m-d' }}" required>

        <br><br>

        <label>Description:</label>
        <br>
        <textarea name="description">{{ expense.description }}</textarea>

        <br><br>

        <button type="submit">Save Changes</button>
    </form>

    <br>

    <a href="{% url 'seller_dashboard' %}">
        <button>Cancel</button>
    </a>

</body>
</html>
