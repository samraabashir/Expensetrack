<!DOCTYPE html>
<html>
<head>
    <title>ExpenseTrack - Seller Dashboard</title>
</head>
<body>

    <h1>ExpenseTrack</h1>
    <h2>Seller Dashboard</h2>

    <p>Welcome to your seller dashboard.</p>

    <a href="{% url 'add_expense' %}">
    <button>Add Expense</button>
</a>

    <h3>Your Expenses</h3>

{% if expenses %}
    <ul>
        {% for expense in expenses %}
            <li>
                {{ expense.name }} -
                {{ expense.amount }} -
                {{ expense.category }} -
                {{ expense.date }}

                <a href="{% url 'edit_expense' expense.id %}">
            <button>Edit</button>
        </a>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>You have no expenses yet.</p>
{% endif %}

    <a href="{% url 'logout' %}">
    <button>Logout</button>
</a>

</body>
</html>
