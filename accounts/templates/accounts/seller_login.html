<!DOCTYPE html>
<html>
<head>
    <title>Seller Login - ExpenseTrack</title>
</head>
<body>

    <h1>ExpenseTrack</h1>
    <h2>Seller Login</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Username:</label>
        <input type="text" name="username" required>

        <br><br>

        <label>Password:</label>
        <input type="password" name="password" required>

        <br><br>

        <button type="submit">Login</button>
    </form>

</body>
</html>
